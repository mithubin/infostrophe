        <div>
          <figure class="table">
            <table>
              <thead>
                <tr>
                  <th><strong>Native Americans (1600-1900)</strong>
                  </th>
                  <th><strong>Palästinenser (1900-heute)</strong>
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Europäische Siedler in Wellen</td>
                  <td>Zionistische Alijas (1880-1948)</td>
                </tr>
                <tr>
                  <td>"Terra Nullius" (leeres Land)</td>
                  <td>"Land ohne Volk für Volk ohne Land"</td>
                </tr>
                <tr>
                  <td>Verträge systematisch gebrochen</td>
                  <td>Oslo, Camp David gescheitert</td>
                </tr>
                <tr>
                  <td>Reservate (immer kleiner werdend)</td>
                  <td>Gaza, Westjordanland (Bantustans)</td>
                </tr>

                  <td>Massaker: Sand Creek, Wounded Knee</td>
                  <td>Deir Yassin (1948), Sabra/Shatila (1982), Gaza (2023-24)</td>
                </tr>
                <tr>
                  <td>"Indianer-Kriege" als Zivilisationsmission</td>
                  <td>"Mowing the lawn" (Gaza-Operationen)</td>
                </tr>

                  <td>Endstadium: Fast ausgelöscht, marginalisiert</td>
                  <td>Drohendes Szenario: Vertreibung nach Sinai/Jordanien?</td>
                </tr>
              </tbody>
            </table>
          </figure>

        <p><strong>Unterschied:</strong> Native Americans hatten keine internationale
